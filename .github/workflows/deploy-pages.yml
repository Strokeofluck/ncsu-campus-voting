name: Publish campus voting site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage published website files only
        shell: python
        run: |
          import hashlib, json, os, pathlib, re, shutil, subprocess
          target = pathlib.Path('_public')
          target.mkdir()
          public_dirs = {'article', 'editor-maps', 'vendor', 'downloads'}
          tracked = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          # Keep every snapshot referenced by a published HTML page. Historical,
          # unreferenced root snapshots stay in Git without inflating each deploy.
          snapshots = set()
          for name in tracked:
              p = pathlib.Path(name)
              if p.suffix == '.html':
                  snapshots.update(re.findall(r'snapshot\.[a-f0-9]+\.json', p.read_text(encoding='utf-8')))
          for name in tracked:
              p = pathlib.Path(name)
              allowed = (len(p.parts) == 1 and p.suffix in {'.html', '.js', '.css', '.json'}) or p.parts[0] in public_dirs or name.startswith(('docs/images/', 'data/processed/', 'data/sources/')) or (p.parts[0] == 'docs' and p.suffix == '.md')
              if len(p.parts) == 1 and p.name.startswith('snapshot.') and p.name not in snapshots:
                  allowed = False
              if allowed:
                  dest = target / p
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(p, dest)
                  # The current embeds contain the same reviewed snapshot.
                  # Use their existing external-snapshot loader on the hosted
                  # site, while keeping Git and downloaded HTML self-contained.
                  if p.suffix == '.html' and (p.name.endswith('-20261109-v2.html') or p.parent.name == 'editor-maps'):
                      text = dest.read_text(encoding='utf-8')
                      match = re.search(r'(<script[^>]*id="data-app-reviewed-snapshot"[^>]*>)(.*?)(</script>)', text, re.S)
                      if match and 'data-app-local-snapshot' not in text and len(match[2]) > 1024 * 1024:
                          raw = match[2].encode('utf-8')
                          digest = hashlib.sha256(raw).hexdigest()
                          shared = target / '_shared' / ('snapshot.' + digest + '.json')
                          shared.parent.mkdir(exist_ok=True)
                          shared.write_bytes(raw)
                          stub = json.loads(match[2])
                          stub['queries'] = {}
                          text = text[:match.start(2)] + json.dumps(stub, separators=(',', ':')).replace('</', '<\\/') + text[match.end(2):]
                          relative = os.path.relpath(shared, dest.parent).replace(os.sep, '/')
                          text = text.replace('</head>', '<meta name="data-app-local-snapshot" content="' + relative + '"></head>', 1)
                          dest.write_text(text, encoding='utf-8')
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _public
          name: github-pages-${{ github.run_attempt }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 600000
          artifact_name: github-pages-${{ github.run_attempt }}
